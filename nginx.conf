server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reenvia al Backend real (docker-compose.yml del repo Backend publica 8081->8080 en
  # el host). host.docker.internal resuelve al host desde dentro del contenedor
  # (Docker Desktop lo define nativo; docker-compose.yml agrega extra_hosts para que
  # tambien funcione en Docker Engine/Linux). Con esto el navegador solo habla con
  # localhost:8080 (mismo origen que el Frontend), sin depender de CORS del Backend.
  location /api/ {
    proxy_pass http://host.docker.internal:8081/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
